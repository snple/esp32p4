[package]
name = "esp32p4-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Examples for esp32p4"
repository.workspace = true
publish = false
autobins = false

[features]
default = []
# Enables defmt logging in the HAL and provides an RTT logger.
defmt = ["esp32p4/defmt", "dep:defmt", "dep:defmt-rtt"]
# Enables defmt logging in the HAL and lets it own the global logger, writing to
# the USB Serial/JTAG port that `espflash monitor` already watches. Mutually
# exclusive with `defmt`, which installs an RTT logger.
defmt-usb = ["esp32p4/defmt-usb-logger", "dep:defmt"]
# Synchronous TCP/IP over the EMAC (smoltcp), heap-free.
net = ["esp32p4/net"]
# Same, but with the socket table allocated from the global allocator.
net-alloc = ["esp32p4/net-alloc", "net"]

[dependencies]
esp32p4.workspace = true
esp32p4-pac.workspace = true
esp32p4-rt.workspace = true
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }

[[bin]]
name = "blink"
path = "src/blink.rs"

[[bin]]
name = "psram"
path = "src/psram.rs"

[[bin]]
name = "psram_split"
path = "src/psram_split.rs"

[[bin]]
name = "defmt_log"
path = "src/defmt_log.rs"
required-features = ["defmt"]

[[bin]]
name = "emac"
path = "src/emac.rs"

[[bin]]
name = "net_tcp_echo"
path = "src/net_tcp_echo.rs"
required-features = ["net"]

[[bin]]
name = "usb_serial"
path = "src/usb_serial.rs"

[[bin]]
name = "defmt_usb"
path = "src/defmt_usb.rs"
required-features = ["defmt-usb"]
