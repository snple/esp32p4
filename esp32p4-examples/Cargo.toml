[package]
name = "esp32p4-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Examples for esp32p4"
repository.workspace = true
publish = false
autobins = false

[features]
default = ["defmt-usb", "net"]
# Turns on the `defmt` log statements in the HAL and the examples. A transport
# has to be picked on top of it: exactly one of `defmt-rtt` and `defmt-usb`.
defmt = ["esp32p4/defmt", "esp32p4-usb/defmt", "dep:defmt"]
# Installs the `defmt-rtt` logger. Frames land in an RTT buffer in RAM, so only
# a debug probe sees them: `probe-rs run --chip esp32p4 <elf>`.
defmt-rtt = ["defmt", "dep:defmt-rtt"]
# Installs the USB Serial/JTAG logger. `espflash monitor` decodes the frames, so
# the flashing cable is all it takes. Mutually exclusive with `defmt-rtt`.
defmt-usb = ["defmt", "esp32p4/defmt-usb"]
# Synchronous TCP/IP over the EMAC (smoltcp), heap-free.
net = ["esp32p4/net"]
# Same, but with the socket table allocated from the global allocator.
net-alloc = ["esp32p4/net-alloc", "net"]

[dependencies]
esp32p4.workspace = true
esp32p4-usb.workspace = true
esp32p4-pac.workspace = true
esp32p4-rt.workspace = true
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }

[[bin]]
name = "blink"
path = "src/blink.rs"

[[bin]]
name = "gpio_interrupt"
path = "src/gpio_interrupt.rs"

[[bin]]
name = "efuse"
path = "src/efuse.rs"
required-features = ["defmt-rtt"]

[[bin]]
name = "mmu"
path = "src/mmu.rs"
required-features = ["defmt-rtt"]

[[bin]]
name = "psram"
path = "src/psram.rs"

[[bin]]
name = "psram_split"
path = "src/psram_split.rs"

[[bin]]
name = "defmt_log"
path = "src/defmt_log.rs"
required-features = ["defmt-rtt"]

[[bin]]
name = "clock"
path = "src/clock.rs"
required-features = ["defmt-rtt"]

[[bin]]
name = "tcm"
path = "src/tcm.rs"
required-features = ["defmt-rtt"]

[[bin]]
name = "emac"
path = "src/emac.rs"

[[bin]]
name = "net_tcp_echo"
path = "src/net_tcp_echo.rs"
required-features = ["net"]

[[bin]]
name = "watchdog"
path = "src/watchdog.rs"

[[bin]]
name = "alarm"
path = "src/alarm.rs"

[[bin]]
name = "timer"
path = "src/timer.rs"

[[bin]]
name = "usb_serial"
path = "src/usb_serial.rs"

[[bin]]
name = "usb_cdc"
path = "src/usb_cdc.rs"

[[bin]]
name = "usb_cdc_hs"
path = "src/usb_cdc_hs.rs"

[[bin]]
name = "defmt_usb"
path = "src/defmt_usb.rs"
required-features = ["defmt-usb"]
