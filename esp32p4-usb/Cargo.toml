[package]
name = "esp32p4-usb"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "USB device stack for the ESP32-P4 on-chip OTG controllers"
readme = "README.md"
keywords = ["esp32p4", "usb", "embedded", "no-std", "otg"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
# `defmt::Format` implementations and trace logging.
defmt = ["dep:defmt", "usb-stack/defmt"]

[dependencies]
esp32p4-pac.workspace = true
usb-stack.workspace = true
defmt = { workspace = true, optional = true }

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["riscv32imafc-unknown-none-elf"]
